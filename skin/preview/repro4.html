<!DOCTYPE html><html><head><meta charset="utf-8"><style>
/* 复现实机故障：皮肤盒子按视口单位铺满，但**容器被一个更小的窗口裁掉**
   （实机表现：探针报 1912x1115，真实窗口更窄 → 右侧/底部露黑） */
html,body{margin:0;height:100%;background:#333;overflow:hidden}
.window{position:absolute;left:0;top:0;width:1600px;height:900px;overflow:hidden;background:#000}
.myh-root{position:absolute;inset:0;width:100vw;height:100vh;margin:0;padding:0;
  z-index:0;pointer-events:none;background:#000;overflow:hidden}
.myh-bg{position:absolute;inset:0;display:block;width:100vw;height:100vh;
  max-width:none;max-height:none;margin:0;overflow:hidden;
  object-fit:cover;object-position:50% 50%}
</style></head><body>
<div class="window"><div class="myh-root">
  <img class="myh-bg" src="../assets/bg/A3_img0231_01_01.mzp.png">
</div></div>
</body></html>
