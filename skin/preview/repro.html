<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#ccc;overflow:hidden}
/* 与实机 .myh-root 一字不差的四条 */
.myh-root{position:fixed;inset:0;width:100vw;height:100vh;margin:0;padding:0;
  z-index:0;pointer-events:none;background:#000;overflow:hidden}
.myh-under{position:absolute;inset:0;width:100vw;height:100vh;margin:0;
  z-index:0;pointer-events:none;overflow:hidden;background:inherit}
.myh-bg{position:absolute;inset:0;display:block;width:100vw;height:100vh;
  max-width:none;max-height:none;margin:0;overflow:hidden;
  object-fit:cover;object-position:50% 50%;user-select:none;transition:opacity .55s ease}
</style></head><body>
<div class="myh-root"><div class="myh-under">
  <img class="myh-bg" src="../assets/bg/A3_img0231_01_01.mzp.png">
</div></div>
</body></html>
