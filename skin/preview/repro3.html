<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
.myh-root{position:fixed;inset:0;width:100vw;height:100vh;margin:0;padding:0;
  z-index:0;pointer-events:none;background:#000;overflow:hidden}
.myh-under{position:absolute;inset:0;width:100vw;height:100vh;margin:0;
  z-index:0;pointer-events:none;overflow:hidden;background:inherit}
.myh-bg{position:absolute;inset:0;display:block;width:100vw;height:100vh;
  max-width:none;max-height:none;margin:0;overflow:hidden;
  object-fit:cover;object-position:50% 50%}
.myh-stage{position:absolute;inset:0;z-index:1;display:grid;align-items:end;align-content:end;justify-items:start;
  pointer-events:none;--myh-sprite-x:20vw}
.myh-sprite{--myh-sprite-ar:0.9921383647798742;--myh-sprite-bw:calc(var(--myh-sprite-ar) * 76vh);max-width:none;height:76vh;width:auto;
  margin-left:max(min(calc(50% - var(--myh-sprite-bw) / 2 + var(--myh-sprite-x,20vw)),calc(100% - var(--myh-sprite-bw))),min(calc(50% - var(--myh-sprite-bw) / 2),0px));
  filter:drop-shadow(0 18px 34px rgba(0,0,0,.45))}
</style></head><body>
<div class="myh-root"><div class="myh-under">
  <img class="myh-bg" src="../assets/bg/A3_img0231_01_01.mzp.png">
  <div class="myh-stage"><img class="myh-sprite" src="../assets/sprite/stage_a3_c02_01.png"></div>
</div></div>
</body></html>
